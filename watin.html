      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #133a6f;
        --ink: #0d2545;
        --teal: #14998f;
        --teal-d: #0f7d75;
        --mist: #f1f6f9;
        --line: #d8e3ea;
        --text: #34475f;
        --white: #fff;
        --font: 'Sora', 'Cairo', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 84px;
      }
      body {
        font-family: var(--font);
        color: var(--text);
        background: #fff;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      [dir='rtl'] body {
        line-height: 1.9;
      }
      img {
        display: block;
        max-width: 100%;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: 3px;
        border-radius: 4px;
      }
      .wrap {
        width: min(1180px, 92%);
        margin-inline: auto;
      }
      h1,
      h2,
      h3 {
        color: var(--ink);
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      [dir='rtl'] h1,
      [dir='rtl'] h2,
      [dir='rtl'] h3 {
        letter-spacing: 0;
        line-height: 1.35;
      }

      /* NAV */
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 72px;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }
      .brand img {
        height: 44px;
        width: auto;
      }
      .brand b {
        font-size: 1.25rem;
        color: var(--navy);
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .brand i {
        font-style: normal;
        color: var(--teal);
        font-weight: 300;
        margin-inline: 0.35em;
      }
      .links {
        display: flex;
        gap: 28px;
        align-items: center;
      }
      .links a {
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--ink);
      }
      .links a:hover {
        color: var(--teal-d);
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .lang {
        display: flex;
        border: 1.5px solid var(--line);
        border-radius: 999px;
        padding: 3px;
      }
      .lang button {
        border: 0;
        background: none;
        font: 600 0.82rem var(--font);
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        color: var(--ink);
      }
      .lang button[aria-pressed='true'] {
        background: var(--navy);
        color: #fff;
      }
      .burger {
        display: none;
        border: 1.5px solid var(--line);
        background: #fff;
        border-radius: 10px;
        width: 42px;
        height: 42px;
        cursor: pointer;
      }
      .burger span {
        display: block;
        width: 18px;
        height: 2px;
        background: var(--navy);
        margin: 4px auto;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 26px;
        border-radius: 999px;
        font: 700 0.98rem var(--font);
        text-decoration: none;
        border: 2px solid transparent;
        cursor: pointer;
        transition:
          transform 0.2s,
          background 0.2s,
          color 0.2s;
      }
      .btn-p {
        background: var(--teal);
        color: #fff;
      }
      .btn-p:hover {
        background: var(--teal-d);
        transform: translateY(-2px);
      }
      .btn-o {
        border-color: var(--navy);
        color: var(--navy);
        background: #fff;
      }
      .btn-o:hover {
        background: var(--navy);
        color: #fff;
      }

      /* HERO */
      .hero {
        position: relative;
        overflow: hidden;
        padding: 56px 0 96px;
      }
      .hero .wrap {
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        gap: 48px;
        align-items: center;
      }
      .hero h1 {
        font-size: clamp(2.5rem, 5.6vw, 4.7rem);
        color: var(--navy);
      }
      .hero p.lead {
        margin: 24px 0 34px;
        font-size: 1.12rem;
        max-width: 34em;
      }
      .hero .cta {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .visual {
        position: relative;
        aspect-ratio: 1/1.02;
      }
      .photo {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--navy), var(--teal));
        clip-path: polygon(14% 0, 100% 0, 86% 100%, 0 100%);
        overflow: hidden;
      }
      [dir='rtl'] .photo {
        clip-path: polygon(0 0, 86% 0, 100% 100%, 14% 100%);
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .photo::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(160deg, rgba(19, 58, 111, 0.35), rgba(20, 153, 143, 0.1));
      }
      .growth {
        position: absolute;
        inset: -4% -6% -2% -6%;
        width: 112%;
        height: 106%;
        overflow: visible;
        pointer-events: none;
      }
      [dir='rtl'] .growth {
        transform: scaleX(-1);
      }
      .growth .under {
        stroke: #fff;
        stroke-width: 17;
        fill: none;
        stroke-linecap: round;
      }
      .growth .line {
        stroke: var(--teal);
        stroke-width: 9;
        fill: none;
        stroke-linecap: round;
      }
      .growth .head {
        fill: var(--teal);
      }
      .tag {
        position: absolute;
        inset-inline-start: -4%;
        bottom: 7%;
        background: #fff;
        border-radius: 14px;
        padding: 14px 20px;
        box-shadow: 0 12px 34px rgba(13, 37, 69, 0.18);
        border-inline-start: 5px solid var(--teal);
        font-weight: 700;
        color: var(--ink);
        font-size: 0.95rem;
      }
      .tag small {
        display: block;
        color: var(--text);
        font-weight: 400;
      }

      /* hero entrance : un seul moment orchestré */
      @media (prefers-reduced-motion: no-preference) {
        .hero h1,
        .hero .lead,
        .hero .cta {
          opacity: 0;
          transform: translateY(18px);
          animation: in 0.8s 0.1s forwards cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        .hero .lead {
          animation-delay: 0.25s;
        }
        .hero .cta {
          animation-delay: 0.4s;
        }
        .photo {
          animation: wipe 1s 0.1s both cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        .growth .under,
        .growth .line {
          stroke-dasharray: 760;
          stroke-dashoffset: 760;
          animation: draw 1.7s 0.7s forwards cubic-bezier(0.5, 0, 0.2, 1);
        }
        .growth .head {
          opacity: 0;
          animation: pop 0.4s 2.15s forwards;
        }
        .tag {
          opacity: 0;
          animation: in 0.7s 1.9s forwards;
        }
      }
      @keyframes in {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes wipe {
        from {
          clip-path: polygon(14% 0, 14% 0, 0 100%, 0 100%);
        }
      }

      /* SERVICES */
      .sec {
        padding: 96px 0;
      }
      .sec-head {
        max-width: 40em;
        margin-bottom: 48px;
      }
      .sec-head h2 {
        font-size: clamp(1.9rem, 3.6vw, 2.9rem);
        color: var(--navy);
        margin-bottom: 14px;
      }
      .services {
        background: var(--mist);
      }
      .svc {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 40px;
        align-items: start;
      }
      .tabs {
        display: flex;
        flex-direction: column;
        border-inline-start: 2px solid var(--line);
      }
      .tabs button {
        text-align: start;
        background: none;
        border: 0;
        font: 700 1.02rem var(--font);
        color: var(--text);
        padding: 14px 22px;
        cursor: pointer;
        position: relative;
        transition:
          color 0.2s,
          background 0.2s;
      }
      .tabs button::before {
        content: '';
        position: absolute;
        inset-inline-start: -2px;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--teal);
        transform: scaleY(0);
        transition: transform 0.25s;
      }
      .tabs button:hover {
        color: var(--navy);
      }
      .tabs button[aria-selected='true'] {
        color: var(--navy);
        background: #fff;
      }
      .tabs button[aria-selected='true']::before {
        transform: scaleY(1);
      }
      .panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: #fff;
        border-radius: 6px 44px 6px 44px;
        overflow: hidden;
        min-height: 430px;
        box-shadow: 0 18px 50px rgba(13, 37, 69, 0.1);
      }
      [dir='rtl'] .panel {
        border-radius: 44px 6px 44px 6px;
      }
      .panel .img {
        background: linear-gradient(135deg, var(--navy), var(--teal));
        position: relative;
        min-height: 260px;
      }
      .panel .img img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .panel .body {
        padding: 40px 36px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .panel h3 {
        font-size: 1.7rem;
        margin-bottom: 12px;
        color: var(--navy);
      }
      .panel ul {
        list-style: none;
        margin: 20px 0 28px;
        display: grid;
        gap: 10px;
      }
      .panel li {
        padding-inline-start: 28px;
        position: relative;
        font-weight: 600;
        color: var(--ink);
      }
      .panel li::before {
        content: '';
        position: absolute;
        inset-inline-start: 0;
        top: 0.55em;
        width: 14px;
        height: 8px;
        border-inline-start: 3px solid var(--teal);
        border-bottom: 3px solid var(--teal);
        transform: rotate(-45deg) translateY(-30%);
      }
      [dir='rtl'] .panel li::before {
        transform: rotate(45deg) translateY(-30%);
        border-inline-start: 0;
        border-inline-end: 3px solid var(--teal);
      }
      .panel .btn {
        align-self: flex-start;
      }
      .fade {
        animation: fade 0.45s both;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* APPROCHE */
      .steps {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px;
        align-items: end;
      }
      .step {
        border-top: 6px solid var(--teal);
        background: var(--mist);
        padding: 26px 24px 30px;
        border-radius: 0 0 4px 4px;
      }
      .step:nth-child(1) {
        padding-top: 26px;
        min-height: 190px;
      }
      .step:nth-child(2) {
        min-height: 240px;
      }
      .step:nth-child(3) {
        min-height: 290px;
      }
      .step:nth-child(4) {
        min-height: 340px;
        background: var(--navy);
        border-top-color: #37c2b6;
      }
      .step:nth-child(4) h3,
      .step:nth-child(4) p {
        color: #fff;
      }
      .step b {
        display: block;
        font-size: 2.4rem;
        color: var(--teal);
        line-height: 1;
        margin-bottom: 14px;
      }
      .step:nth-child(4) b {
        color: #37c2b6;
      }
      .step h3 {
        font-size: 1.2rem;
        margin-bottom: 8px;
      }
      .step p {
        font-size: 0.95rem;
      }

      /* A PROPOS */
      .about {
        background: var(--navy);
        color: #d6e2f2;
      }
      .about .wrap {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 64px;
        align-items: center;
      }
      .logo-card {
        background: #fff;
        border-radius: 6px 44px 6px 44px;
        padding: 36px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      }
      [dir='rtl'] .logo-card {
        border-radius: 44px 6px 44px 6px;
      }
      .about h2 {
        color: #fff;
        font-size: clamp(1.9rem, 3.4vw, 2.7rem);
        margin-bottom: 16px;
      }
      .dirs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 34px;
      }
      .dir {
        display: flex;
        align-items: center;
        gap: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.25);
        padding-top: 18px;
      }
      .dir span {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--teal);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        flex: none;
      }
      .dir b {
        display: block;
        color: #fff;
      }
      .dir small {
        color: #a9bfdc;
      }

      /* CONTACT */
      .contact .wrap {
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        gap: 56px;
      }
      .info {
        display: grid;
        gap: 22px;
        margin-top: 26px;
      }
      .info div {
        padding-inline-start: 18px;
        border-inline-start: 4px solid var(--teal);
      }
      .info small {
        display: block;
        color: var(--teal-d);
        font-weight: 700;
      }
      .info a {
        text-decoration: none;
        color: var(--ink);
        font-weight: 700;
      }
      .info a:hover {
        color: var(--teal-d);
      }
      form {
        background: var(--mist);
        padding: 34px;
        border-radius: 6px 36px 6px 36px;
        display: grid;
        gap: 16px;
      }
      [dir='rtl'] form {
        border-radius: 36px 6px 36px 6px;
      }
      label {
        font-weight: 700;
        color: var(--ink);
        font-size: 0.92rem;
        display: grid;
        gap: 6px;
      }
      input,
      textarea,
      select {
        font: inherit;
        padding: 13px 16px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        width: 100%;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 3px solid rgba(20, 153, 143, 0.35);
        border-color: var(--teal);
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }

      footer {
        background: var(--ink);
        color: #a9bfdc;
        padding: 34px 0;
        font-size: 0.92rem;
      }
      footer .wrap {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      footer .logo-s {
        background: #fff;
        border-radius: 8px;
        padding: 6px 10px;
      }
      footer .logo-s img {
        height: 34px;
      }

      @media (max-width: 980px) {
        .hero .wrap,
        .about .wrap,
        .contact .wrap,
        .svc {
          grid-template-columns: 1fr;
        }
        .visual {
          max-width: 560px;
          margin-inline: auto;
          width: 100%;
        }
        .tabs {
          flex-direction: row;
          overflow-x: auto;
          border-inline-start: 0;
          border-bottom: 2px solid var(--line);
        }
        .tabs button {
          white-space: nowrap;
        }
        .tabs button::before {
          inset: auto 0 -2px 0;
          height: 4px;
          width: auto;
          transform: scaleX(0);
        }
        .tabs button[aria-selected='true']::before {
          transform: scaleX(1);
        }
        .steps {
          grid-template-columns: 1fr 1fr;
        }
        .step:nth-child(n) {
          min-height: 0;
        }
      }
      @media (max-width: 760px) {
        .burger {
          display: block;
        }
        .links {
          display: none;
          position: absolute;
          top: 72px;
          inset-inline: 0;
          background: #fff;
          flex-direction: column;
          padding: 20px 5%;
          gap: 18px;
          border-bottom: 1px solid var(--line);
          align-items: flex-start;
        }
        .links.open {
          display: flex;
        }
        .panel {
          grid-template-columns: 1fr;
        }
        .dirs {
          grid-template-columns: 1fr;
        }
        .steps {
          grid-template-columns: 1fr;
        }
        .hero {
          padding-top: 32px;
        }
        .sec {
          padding: 68px 0;
        }
      }
    </style>
  </head>
